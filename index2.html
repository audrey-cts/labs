<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- 側邊欄 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">✓ 待辦清單</h1>
                <button class="sidebar-toggle" id="sidebarToggle" aria-label="關閉選單">✕</button>
            </div>

            <nav class="sidebar-nav">
                <ul class="nav-list">
                    <li class="nav-item active" data-filter="all">
                        <span class="nav-icon">📋</span>
                        <span class="nav-label">全部任務</span>
                        <span class="nav-count" id="countAll">0</span>
                    </li>
                    <li class="nav-item" data-filter="today">
                        <span class="nav-icon">📅</span>
                        <span class="nav-label">今日任務</span>
                        <span class="nav-count" id="countToday">0</span>
                    </li>
                    <li class="nav-item" data-filter="active">
                        <span class="nav-icon">🔄</span>
                        <span class="nav-label">進行中</span>
                        <span class="nav-count" id="countActive">0</span>
                    </li>
                    <li class="nav-item" data-filter="completed">
                        <span class="nav-icon">✅</span>
                        <span class="nav-label">已完成</span>
                        <span class="nav-count" id="countCompleted">0</span>
                    </li>
                    <li class="nav-item" data-filter="overdue">
                        <span class="nav-icon">⚠️</span>
                        <span class="nav-label">已逾期</span>
                        <span class="nav-count" id="countOverdue">0</span>
                    </li>
                </ul>

                <div class="nav-section-title">分類</div>
                <ul class="nav-list" id="categoryList">
                    <!-- 動態生成 -->
                </ul>

                <button class="add-category-btn" id="addCategoryBtn">+ 新增分類</button>
            </nav>

            <div class="sidebar-footer">
                <div class="stats-mini">
                    <div class="stat-mini-item">
                        <span id="statTotal">0</span>
                        <small>總計</small>
                    </div>
                    <div class="stat-mini-item">
                        <span id="statDone">0</span>
                        <small>完成</small>
                    </div>
                    <div class="stat-mini-item">
                        <span id="statRate">0%</span>
                        <small>完成率</small>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 主內容 -->
        <main class="main">
            <!-- 頂部工具列 -->
            <header class="topbar">
                <div class="topbar-left">
                    <button class="menu-btn" id="menuBtn" aria-label="開啟選單">☰</button>
                    <h2 class="current-view" id="currentViewTitle">全部任務</h2>
                </div>
                <div class="topbar-right">
                    <button class="icon-btn" id="statsBtn" title="統計">📊</button>
                    <button class="icon-btn" id="exportBtn" title="匯出">📤</button>
                    <button class="icon-btn" id="importBtn" title="匯入">📥</button>
                    <button class="icon-btn" id="themeBtn" title="切換主題">🌙</button>
                    <input type="file" id="importFile" accept=".json" style="display:none">
                </div>
            </header>

            <!-- 搜尋與篩選列 -->
            <div class="filter-bar">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="搜尋任務..." class="search-input">
                    <button class="clear-search" id="clearSearch">✕</button>
                </div>
                <div class="filter-controls">
                    <select class="filter-select" id="priorityFilter">
                        <option value="">所有優先度</option>
                        <option value="high">🔴 高</option>
                        <option value="medium">🟡 中</option>
                        <option value="low">🟢 低</option>
                    </select>
                    <select class="filter-select" id="sortSelect">
                        <option value="created">建立時間</option>
                        <option value="dueDate">截止日期</option>
                        <option value="priority">優先度</option>
                        <option value="title">名稱</option>
                    </select>
                    <button class="icon-btn sort-dir-btn" id="sortDirBtn" title="排序方向">↓</button>
                </div>
            </div>

            <!-- 進度條 -->
            <div class="progress-section">
                <div class="progress-bar-wrap">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
                <span class="progress-label" id="progressLabel">0 / 0 完成</span>
            </div>

            <!-- 快速新增 -->
            <div class="quick-add">
                <input type="text" id="quickAddInput" placeholder="快速新增任務，按 Enter 送出..." class="quick-add-input">
                <button class="add-btn" id="quickAddBtn">新增</button>
            </div>

            <!-- 批次操作 -->
            <div class="bulk-actions" id="bulkActions" style="display:none">
                <label class="select-all-wrap">
                    <input type="checkbox" id="selectAll"> 全選
                </label>
                <span class="selected-count" id="selectedCount">已選 0 項</span>
                <button class="bulk-btn danger" id="bulkDeleteBtn">刪除</button>
                <button class="bulk-btn" id="bulkCompleteBtn">完成</button>
                <button class="bulk-btn" id="bulkUncompleteBtn">取消完成</button>
                <button class="bulk-btn danger" id="clearCompletedBtn">清除已完成</button>
            </div>

            <!-- 任務列表 -->
            <div class="task-list" id="taskList">
                <!-- 動態生成 -->
            </div>

            <!-- 空狀態 -->
            <div class="empty-state" id="emptyState" style="display:none">
                <div class="empty-icon">📭</div>
                <h3>沒有任務</h3>
                <p>點擊上方「新增」或按 Enter 來新增任務</p>
            </div>
        </main>
    </div>

    <!-- 新增/編輯任務 Modal -->
    <div class="modal-overlay" id="taskModal" style="display:none">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">新增任務</h3>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="taskTitle">任務名稱 *</label>
                    <input type="text" id="taskTitle" placeholder="輸入任務名稱" maxlength="200">
                </div>
                <div class="form-group">
                    <label for="taskDesc">描述</label>
                    <textarea id="taskDesc" placeholder="輸入任務描述（可選）" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskPriority">優先度</label>
                        <select id="taskPriority">
                            <option value="low">🟢 低</option>
                            <option value="medium" selected>🟡 中</option>
                            <option value="high">🔴 高</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskCategory">分類</label>
                        <select id="taskCategory">
                            <option value="">無分類</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskDueDate">截止日期</label>
                        <input type="date" id="taskDueDate">
                    </div>
                    <div class="form-group">
                        <label for="taskDueTime">截止時間</label>
                        <input type="time" id="taskDueTime">
                    </div>
                </div>
                <div class="form-group">
                    <label>標籤</label>
                    <div class="tag-input-wrap">
                        <input type="text" id="tagInput" placeholder="輸入標籤後按 Enter">
                        <div class="tags-preview" id="tagsPreview"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label>子任務</label>
                    <div class="subtask-input-wrap">
                        <input type="text" id="subtaskInput" placeholder="輸入子任務後按 Enter">
                        <div class="subtask-list" id="subtaskList"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="modalCancel">取消</button>
                <button class="btn-primary" id="modalSave">儲存</button>
            </div>
        </div>
    </div>

    <!-- 新增分類 Modal -->
    <div class="modal-overlay" id="categoryModal" style="display:none">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h3>新增分類</h3>
                <button class="modal-close" id="categoryModalClose">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="categoryName">分類名稱</label>
                    <input type="text" id="categoryName" placeholder="輸入分類名稱">
                </div>
                <div class="form-group">
                    <label>分類顏色</label>
                    <div class="color-picker" id="colorPicker">
                        <span class="color-dot selected" data-color="#6366f1" style="background:#6366f1"></span>
                        <span class="color-dot" data-color="#ec4899" style="background:#ec4899"></span>
                        <span class="color-dot" data-color="#f59e0b" style="background:#f59e0b"></span>
                        <span class="color-dot" data-color="#10b981" style="background:#10b981"></span>
                        <span class="color-dot" data-color="#3b82f6" style="background:#3b82f6"></span>
                        <span class="color-dot" data-color="#ef4444" style="background:#ef4444"></span>
                        <span class="color-dot" data-color="#8b5cf6" style="background:#8b5cf6"></span>
                        <span class="color-dot" data-color="#06b6d4" style="background:#06b6d4"></span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="categoryModalCancel">取消</button>
                <button class="btn-primary" id="categoryModalSave">儲存</button>
            </div>
        </div>
    </div>

    <!-- 統計 Modal -->
    <div class="modal-overlay" id="statsModal" style="display:none">
        <div class="modal">
            <div class="modal-header">
                <h3>任務統計</h3>
                <button class="modal-close" id="statsModalClose">✕</button>
            </div>
            <div class="modal-body">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-num" id="sTotalTasks">0</div>
                        <div class="stat-desc">總任務數</div>
                    </div>
                    <div class="stat-card completed">
                        <div class="stat-num" id="sCompletedTasks">0</div>
                        <div class="stat-desc">已完成</div>
                    </div>
                    <div class="stat-card active">
                        <div class="stat-num" id="sActiveTasks">0</div>
                        <div class="stat-desc">進行中</div>
                    </div>
                    <div class="stat-card overdue">
                        <div class="stat-num" id="sOverdueTasks">0</div>
                        <div class="stat-desc">已逾期</div>
                    </div>
                </div>
                <div class="stats-priority">
                    <h4>優先度分佈</h4>
                    <div class="priority-bar-wrap">
                        <div class="priority-bar-item">
                            <span>高</span>
                            <div class="bar-track"><div class="bar-fill high" id="sHighBar"></div></div>
                            <span id="sHighCount">0</span>
                        </div>
                        <div class="priority-bar-item">
                            <span>中</span>
                            <div class="bar-track"><div class="bar-fill medium" id="sMedBar"></div></div>
                            <span id="sMedCount">0</span>
                        </div>
                        <div class="priority-bar-item">
                            <span>低</span>
                            <div class="bar-track"><div class="bar-fill low" id="sLowBar"></div></div>
                            <span id="sLowCount">0</span>
                        </div>
                    </div>
                </div>
                <div class="stats-completion">
                    <h4>完成率</h4>
                    <div class="big-progress">
                        <svg viewBox="0 0 120 120" class="donut">
                            <circle class="donut-bg" cx="60" cy="60" r="50"/>
                            <circle class="donut-fill" id="donutFill" cx="60" cy="60" r="50"
                                    stroke-dasharray="0 314" stroke-dashoffset="78.5"/>
                        </svg>
                        <div class="donut-label" id="donutLabel">0%</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
