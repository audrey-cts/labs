<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待辦清單</title>
    <style>
/* ===== CSS 變數 ===== */
:root {
    --bg: #f1f5f9;
    --surface: #ffffff;
    --surface2: #f8fafc;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-muted: #64748b;
    --primary: #6366f1;
    --primary-light: #818cf8;
    --primary-dark: #4f46e5;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --sidebar-w: 260px;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.06);
    --shadow-lg: 0 8px 24px rgba(0,0,0,.12);
    --transition: .2s ease;
}

[data-theme="dark"] {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #273549;
    --border: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --shadow: 0 1px 3px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.2);
    --shadow-lg: 0 8px 24px rgba(0,0,0,.4);
}

/* ===== 重置 ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
    font-family: 'Segoe UI', 'Microsoft JhengHei', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    transition: background var(--transition), color var(--transition);
}
button { cursor: pointer; border: none; background: none; font: inherit; }
input, select, textarea { font: inherit; color: var(--text); }
ul { list-style: none; }

/* ===== 布局 ===== */
.app {
    display: flex;
    min-height: 100vh;
}

/* ===== 側邊欄 ===== */
.sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 100;
    transition: transform var(--transition), background var(--transition);
    overflow-y: auto;
}

.sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 16px 16px;
    border-bottom: 1px solid var(--border);
}

.logo {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: -.5px;
}

.sidebar-toggle {
    display: none;
    width: 32px; height: 32px;
    border-radius: 50%;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 1rem;
}

.sidebar-nav {
    flex: 1;
    padding: 12px 8px;
    overflow-y: auto;
}

.nav-list { margin-bottom: 4px; }

.nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all var(--transition);
    user-select: none;
    position: relative;
}

.nav-item:hover { background: var(--surface2); }
.nav-item.active {
    background: #ede9fe;
    color: var(--primary);
    font-weight: 600;
}
[data-theme="dark"] .nav-item.active { background: rgba(99,102,241,.2); }

.nav-icon { font-size: 1rem; width: 20px; text-align: center; }
.nav-label { flex: 1; font-size: .9rem; }
.nav-count {
    background: var(--surface2);
    color: var(--text-muted);
    font-size: .75rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
    min-width: 24px;
    text-align: center;
}
.nav-item.active .nav-count {
    background: var(--primary);
    color: white;
}

.nav-section-title {
    font-size: .75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-muted);
    padding: 16px 12px 6px;
}

.category-nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all var(--transition);
    font-size: .9rem;
}
.category-nav-item:hover { background: var(--surface2); }
.category-nav-item.active { background: var(--surface2); font-weight: 600; }

.cat-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
}

.category-nav-item .nav-count {
    margin-left: auto;
}

.category-delete-btn {
    opacity: 0;
    color: var(--text-muted);
    font-size: .8rem;
    padding: 2px 4px;
    border-radius: 4px;
    transition: opacity var(--transition);
}
.category-nav-item:hover .category-delete-btn { opacity: 1; }
.category-delete-btn:hover { color: var(--danger); background: rgba(239,68,68,.1); }

.add-category-btn {
    width: 100%;
    padding: 10px 12px;
    text-align: left;
    font-size: .85rem;
    color: var(--text-muted);
    border-radius: var(--radius-sm);
    transition: all var(--transition);
    margin-top: 4px;
}
.add-category-btn:hover { background: var(--surface2); color: var(--primary); }

.sidebar-footer {
    padding: 16px;
    border-top: 1px solid var(--border);
}

.stats-mini {
    display: flex;
    justify-content: space-around;
    text-align: center;
}

.stat-mini-item span {
    display: block;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--primary);
}

.stat-mini-item small {
    font-size: .72rem;
    color: var(--text-muted);
}

/* ===== 主區域 ===== */
.main {
    flex: 1;
    margin-left: var(--sidebar-w);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    max-width: 100%;
}

/* ===== 頂部工具列 ===== */
.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 50;
    transition: background var(--transition);
}

.topbar-left { display: flex; align-items: center; gap: 14px; }

.menu-btn {
    font-size: 1.2rem;
    color: var(--text-muted);
    padding: 6px 8px;
    border-radius: var(--radius-sm);
    transition: all var(--transition);
    display: none;
}
.menu-btn:hover { background: var(--surface2); color: var(--text); }

.current-view { font-size: 1.25rem; font-weight: 700; }

.topbar-right { display: flex; align-items: center; gap: 6px; }

.icon-btn {
    width: 36px; height: 36px;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    color: var(--text-muted);
    transition: all var(--transition);
}
.icon-btn:hover { background: var(--surface2); color: var(--text); }

/* ===== 篩選列 ===== */
.filter-bar {
    display: flex;
    gap: 12px;
    padding: 16px 24px;
    align-items: center;
    flex-wrap: wrap;
}

.search-box {
    flex: 1;
    min-width: 200px;
    position: relative;
    display: flex;
    align-items: center;
}

.search-icon {
    position: absolute;
    left: 12px;
    font-size: .9rem;
    pointer-events: none;
}

.search-input {
    width: 100%;
    padding: 9px 36px 9px 36px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-size: .9rem;
    transition: border-color var(--transition), background var(--transition);
}
.search-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99,102,241,.15);
}

.clear-search {
    position: absolute;
    right: 10px;
    color: var(--text-muted);
    font-size: .8rem;
    display: none;
}
.clear-search.visible { display: block; }
.clear-search:hover { color: var(--danger); }

.filter-controls {
    display: flex;
    gap: 8px;
    align-items: center;
}

.filter-select {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-size: .85rem;
    cursor: pointer;
    transition: border-color var(--transition), background var(--transition);
}
.filter-select:focus { outline: none; border-color: var(--primary); }

.sort-dir-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 1rem;
    font-weight: 700;
}

/* ===== 進度條 ===== */
.progress-section {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 24px 12px;
}

.progress-bar-wrap {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--success));
    border-radius: 10px;
    transition: width .5s ease;
    width: 0%;
}

.progress-label {
    font-size: .8rem;
    color: var(--text-muted);
    white-space: nowrap;
}

/* ===== 快速新增 ===== */
.quick-add {
    display: flex;
    gap: 10px;
    padding: 0 24px 16px;
}

.quick-add-input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    font-size: .95rem;
    transition: all var(--transition);
}
.quick-add-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(99,102,241,.12);
}

.add-btn {
    padding: 12px 22px;
    background: var(--primary);
    color: white;
    border-radius: var(--radius);
    font-size: .95rem;
    font-weight: 600;
    transition: all var(--transition);
    white-space: nowrap;
}
.add-btn:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: var(--shadow); }
.add-btn:active { transform: translateY(0); }

/* ===== 批次操作 ===== */
.bulk-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 24px;
    background: #ede9fe;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
}
[data-theme="dark"] .bulk-actions { background: rgba(99,102,241,.15); }

.select-all-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-size: .9rem;
    font-weight: 600;
}

.selected-count {
    color: var(--text-muted);
    font-size: .85rem;
    margin-left: 4px;
}

.bulk-btn {
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    font-size: .85rem;
    font-weight: 600;
    background: var(--surface);
    border: 1px solid var(--border);
    transition: all var(--transition);
}
.bulk-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
.bulk-btn.danger:hover { background: var(--danger); border-color: var(--danger); }

/* ===== 任務列表 ===== */
.task-list {
    padding: 8px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.task-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    transition: all var(--transition);
    cursor: default;
    animation: taskIn .2s ease;
    position: relative;
}

@keyframes taskIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
}

.task-item:hover {
    box-shadow: var(--shadow);
    border-color: var(--primary-light);
}

.task-item.completed {
    opacity: .65;
}
.task-item.completed .task-title {
    text-decoration: line-through;
    color: var(--text-muted);
}

.task-item.priority-high { border-left: 4px solid var(--danger); }
.task-item.priority-medium { border-left: 4px solid var(--warning); }
.task-item.priority-low { border-left: 4px solid var(--success); }

.task-item.overdue { background: rgba(239,68,68,.04); }
[data-theme="dark"] .task-item.overdue { background: rgba(239,68,68,.08); }

.task-checkbox {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
    transition: all var(--transition);
    margin-top: 2px;
}
.task-checkbox:hover { border-color: var(--primary); background: rgba(99,102,241,.1); }
.task-checkbox.checked {
    background: var(--success);
    border-color: var(--success);
    color: white;
    font-size: .75rem;
}

.task-select {
    width: 16px; height: 16px;
    flex-shrink: 0;
    cursor: pointer;
    margin-top: 4px;
    accent-color: var(--primary);
}

.task-body { flex: 1; min-width: 0; }

.task-header { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 4px; }

.task-title {
    font-size: .95rem;
    font-weight: 600;
    line-height: 1.4;
    word-break: break-word;
    flex: 1;
}

.task-priority-badge {
    font-size: .72rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
}
.badge-high { background: rgba(239,68,68,.12); color: var(--danger); }
.badge-medium { background: rgba(245,158,11,.12); color: var(--warning); }
.badge-low { background: rgba(16,185,129,.12); color: var(--success); }

.task-desc {
    font-size: .85rem;
    color: var(--text-muted);
    margin-bottom: 6px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
}

.task-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: .78rem;
    color: var(--text-muted);
}

.task-due {
    display: flex;
    align-items: center;
    gap: 4px;
}
.task-due.overdue { color: var(--danger); font-weight: 600; }
.task-due.today { color: var(--warning); font-weight: 600; }

.task-category-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: .75rem;
    font-weight: 600;
}

.task-tags { display: flex; gap: 4px; flex-wrap: wrap; }

.task-tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 1px 7px;
    border-radius: 20px;
    font-size: .72rem;
}

.task-subtasks { margin-top: 8px; }

.subtask-progress {
    font-size: .78rem;
    color: var(--text-muted);
    margin-bottom: 4px;
}

.subtask-mini-list { display: flex; flex-direction: column; gap: 3px; }

.subtask-mini-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: .82rem;
    color: var(--text-muted);
}

.subtask-mini-checkbox {
    width: 14px; height: 14px;
    border: 1.5px solid var(--border);
    border-radius: 3px;
    flex-shrink: 0;
    cursor: pointer;
    accent-color: var(--success);
}

.subtask-mini-title.done { text-decoration: line-through; opacity: .6; }

.task-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    opacity: 0;
    transition: opacity var(--transition);
    flex-shrink: 0;
}
.task-item:hover .task-actions { opacity: 1; }

.task-action-btn {
    width: 30px; height: 30px;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: .85rem;
    color: var(--text-muted);
    transition: all var(--transition);
}
.task-action-btn:hover { background: var(--surface2); color: var(--text); }
.task-action-btn.delete:hover { background: rgba(239,68,68,.1); color: var(--danger); }

.drag-handle {
    color: var(--border);
    font-size: 1rem;
    cursor: grab;
    padding: 4px 2px;
    transition: color var(--transition);
    flex-shrink: 0;
    margin-top: 2px;
}
.drag-handle:hover { color: var(--text-muted); }
.task-item.dragging { opacity: .5; box-shadow: var(--shadow-lg); }
.task-item.drag-over { border-color: var(--primary); background: rgba(99,102,241,.04); }

/* ===== 空狀態 ===== */
.empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-muted);
}
.empty-icon { font-size: 3rem; margin-bottom: 16px; }
.empty-state h3 { font-size: 1.2rem; margin-bottom: 8px; color: var(--text); }
.empty-state p { font-size: .9rem; }

/* ===== Modal ===== */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    animation: fadeIn .15s ease;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
    background: var(--surface);
    border-radius: var(--radius);
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-lg);
    animation: slideUp .2s ease;
    overflow: hidden;
}

.modal-sm { max-width: 380px; }

@keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.modal-header h3 { font-size: 1.1rem; font-weight: 700; }

.modal-close {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
    transition: all var(--transition);
    font-size: .9rem;
}
.modal-close:hover { background: var(--surface2); color: var(--danger); }

.modal-body {
    padding: 20px;
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.form-group label {
    font-size: .85rem;
    font-weight: 600;
    color: var(--text-muted);
}

.form-group input,
.form-group select,
.form-group textarea {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface2);
    font-size: .9rem;
    transition: border-color var(--transition), background var(--transition);
    resize: vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99,102,241,.12);
}

/* 標籤輸入 */
.tag-input-wrap { display: flex; flex-direction: column; gap: 8px; }

.tag-input-wrap input {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface2);
    font-size: .9rem;
}
.tag-input-wrap input:focus { outline: none; border-color: var(--primary); }

.tags-preview { display: flex; gap: 6px; flex-wrap: wrap; }

.tag-chip {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(99,102,241,.12);
    color: var(--primary);
    padding: 3px 10px;
    border-radius: 20px;
    font-size: .8rem;
    font-weight: 600;
}

.tag-remove {
    cursor: pointer;
    font-size: .75rem;
    opacity: .7;
}
.tag-remove:hover { opacity: 1; color: var(--danger); }

/* 子任務 */
.subtask-input-wrap { display: flex; flex-direction: column; gap: 8px; }

.subtask-input-wrap input {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface2);
    font-size: .9rem;
}
.subtask-input-wrap input:focus { outline: none; border-color: var(--primary); }

.subtask-list { display: flex; flex-direction: column; gap: 4px; }

.subtask-edit-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    font-size: .85rem;
}

.subtask-edit-item span { flex: 1; }

.subtask-remove {
    color: var(--text-muted);
    font-size: .8rem;
    cursor: pointer;
}
.subtask-remove:hover { color: var(--danger); }

/* 顏色選擇器 */
.color-picker { display: flex; gap: 10px; flex-wrap: wrap; }

.color-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    transition: transform var(--transition);
    border: 3px solid transparent;
}
.color-dot:hover { transform: scale(1.2); }
.color-dot.selected { border-color: var(--text); transform: scale(1.1); }

/* 按鈕 */
.btn-primary {
    padding: 10px 22px;
    background: var(--primary);
    color: white;
    border-radius: var(--radius-sm);
    font-size: .9rem;
    font-weight: 600;
    transition: all var(--transition);
}
.btn-primary:hover { background: var(--primary-dark); }

.btn-secondary {
    padding: 10px 22px;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: .9rem;
    font-weight: 600;
    transition: all var(--transition);
}
.btn-secondary:hover { background: var(--border); }

/* ===== 統計 ===== */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat-card {
    background: var(--surface2);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    border: 1px solid var(--border);
}

.stat-card.completed { border-color: var(--success); }
.stat-card.active { border-color: var(--primary); }
.stat-card.overdue { border-color: var(--danger); }

.stat-num {
    font-size: 2rem;
    font-weight: 800;
    color: var(--primary);
}
.stat-card.completed .stat-num { color: var(--success); }
.stat-card.active .stat-num { color: var(--primary); }
.stat-card.overdue .stat-num { color: var(--danger); }

.stat-desc { font-size: .82rem; color: var(--text-muted); margin-top: 4px; }

.stats-priority { margin-bottom: 20px; }
.stats-priority h4, .stats-completion h4 {
    font-size: .9rem;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .05em;
}

.priority-bar-wrap { display: flex; flex-direction: column; gap: 10px; }

.priority-bar-item {
    display: grid;
    grid-template-columns: 24px 1fr 28px;
    align-items: center;
    gap: 10px;
    font-size: .85rem;
    font-weight: 600;
}

.bar-track {
    height: 10px;
    background: var(--border);
    border-radius: 10px;
    overflow: hidden;
}

.bar-fill {
    height: 100%;
    border-radius: 10px;
    transition: width .5s ease;
    width: 0%;
}
.bar-fill.high { background: var(--danger); }
.bar-fill.medium { background: var(--warning); }
.bar-fill.low { background: var(--success); }

.stats-completion { text-align: center; }

.big-progress {
    position: relative;
    width: 140px;
    height: 140px;
    margin: 0 auto;
}

.donut {
    width: 100%; height: 100%;
    transform: rotate(-90deg);
}

.donut-bg {
    fill: none;
    stroke: var(--border);
    stroke-width: 10;
}

.donut-fill {
    fill: none;
    stroke: var(--primary);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dasharray .6s ease;
}

.donut-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--primary);
}

/* ===== Toast ===== */
.toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 500;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
}

.toast {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 18px;
    box-shadow: var(--shadow-lg);
    font-size: .9rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: toastIn .25s ease;
    pointer-events: auto;
    min-width: 200px;
    max-width: 320px;
}

.toast.success { border-left: 4px solid var(--success); }
.toast.error { border-left: 4px solid var(--danger); }
.toast.info { border-left: 4px solid var(--primary); }

@keyframes toastIn {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
}
@keyframes toastOut {
    from { opacity: 1; transform: translateX(0); }
    to   { opacity: 0; transform: translateX(20px); }
}

/* ===== 響應式 ===== */
.sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 90;
}

@media (max-width: 768px) {
    .sidebar {
        transform: translateX(-100%);
        box-shadow: var(--shadow-lg);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-toggle { display: flex; }
    .sidebar-overlay.visible { display: block; }

    .main { margin-left: 0; }
    .menu-btn { display: flex; }

    .filter-bar { flex-direction: column; align-items: stretch; }

    .task-list { padding: 8px 16px 24px; }
    .progress-section { padding: 0 16px 10px; }
    .bulk-actions { padding: 10px 16px; }
}

@media (max-width: 480px) {
    .task-actions { opacity: 1; }
}

    <script>
/* ===== 資料模型 ===== */
let state = {
    tasks: [],
    categories: [],
    currentFilter: 'all',
    currentCategory: null,
    searchQuery: '',
    priorityFilter: '',
    sortBy: 'created',
    sortAsc: false,
    selectedTasks: new Set(),
    editingTaskId: null,
    editingTags: [],
    editingSubtasks: [],
    selectedColor: '#6366f1',
    dragSrcId: null,
};

const STORAGE_KEYS = { tasks: 'todo_tasks', categories: 'todo_categories' };

/* ===== 持久化 ===== */
function save() {
    localStorage.setItem(STORAGE_KEYS.tasks, JSON.stringify(state.tasks));
    localStorage.setItem(STORAGE_KEYS.categories, JSON.stringify(state.categories));
}

function load() {
    try {
        state.tasks = JSON.parse(localStorage.getItem(STORAGE_KEYS.tasks)) || [];
        state.categories = JSON.parse(localStorage.getItem(STORAGE_KEYS.categories)) || [];
    } catch { state.tasks = []; state.categories = []; }
}

/* ===== 輔助函數 ===== */
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function today() {
    const d = new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}

function pad2(n) { return n.toString().padStart(2, '0'); }

function formatDate(dateStr) {
    if (!dateStr) return '';
    const [y, m, d] = dateStr.split('-');
    return `${y}/${m}/${d}`;
}

function isOverdue(task) {
    if (!task.dueDate || task.completed) return false;
    const due = new Date(task.dueDate + (task.dueTime ? 'T' + task.dueTime : 'T23:59:59'));
    return due < new Date();
}

function isToday(task) {
    if (!task.dueDate) return false;
    return task.dueDate === today();
}

function getCategory(id) { return state.categories.find(c => c.id === id); }

function showToast(msg, type = 'info') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    const icons = { success: '✅', error: '❌', info: 'ℹ️' };
    toast.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
    container.appendChild(toast);
    setTimeout(() => {
        toast.style.animation = 'toastOut .25s ease forwards';
        setTimeout(() => toast.remove(), 250);
    }, 2800);
}

/* ===== 篩選與排序 ===== */
function getFilteredTasks() {
    let list = [...state.tasks];

    // 分類篩選
    if (state.currentCategory) {
        list = list.filter(t => t.categoryId === state.currentCategory);
    }

    // 視圖篩選
    switch (state.currentFilter) {
        case 'today':    list = list.filter(t => isToday(t)); break;
        case 'active':   list = list.filter(t => !t.completed); break;
        case 'completed':list = list.filter(t => t.completed); break;
        case 'overdue':  list = list.filter(t => isOverdue(t)); break;
    }

    // 優先度篩選
    if (state.priorityFilter) {
        list = list.filter(t => t.priority === state.priorityFilter);
    }

    // 搜尋
    if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        list = list.filter(t =>
            t.title.toLowerCase().includes(q) ||
            (t.desc || '').toLowerCase().includes(q) ||
            (t.tags || []).some(tag => tag.toLowerCase().includes(q))
        );
    }

    // 排序
    list.sort((a, b) => {
        let va, vb;
        switch (state.sortBy) {
            case 'dueDate':
                va = a.dueDate || '9999-99-99';
                vb = b.dueDate || '9999-99-99';
                break;
            case 'priority': {
                const p = { high: 0, medium: 1, low: 2 };
                va = p[a.priority] ?? 1;
                vb = p[b.priority] ?? 1;
                break;
            }
            case 'title':
                va = a.title.toLowerCase();
                vb = b.title.toLowerCase();
                break;
            default: // created
                va = a.createdAt;
                vb = b.createdAt;
        }
        if (va < vb) return state.sortAsc ? -1 : 1;
        if (va > vb) return state.sortAsc ? 1 : -1;
        return 0;
    });

    // 已完成沉底
    const active = list.filter(t => !t.completed);
    const done   = list.filter(t => t.completed);
    return [...active, ...done];
}

/* ===== 計數 ===== */
function getCounts() {
    const t = state.tasks;
    return {
        all: t.length,
        today: t.filter(isToday).length,
        active: t.filter(x => !x.completed).length,
        completed: t.filter(x => x.completed).length,
        overdue: t.filter(isOverdue).length,
    };
}

/* ===== 渲染 ===== */
function render() {
    renderTaskList();
    renderSidebar();
    renderProgress();
    updateBulkActionsVisibility();
}

function renderTaskList() {
    const list = getFilteredTasks();
    const container = document.getElementById('taskList');
    const empty = document.getElementById('emptyState');

    if (list.length === 0) {
        container.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';

    container.innerHTML = list.map(task => renderTaskItem(task)).join('');

    // 子任務 checkbox 事件
    container.querySelectorAll('.subtask-mini-checkbox').forEach(el => {
        el.addEventListener('change', () => {
            const taskId = el.closest('.task-item').dataset.id;
            const idx = parseInt(el.dataset.index);
            const task = state.tasks.find(t => t.id === taskId);
            if (task && task.subtasks[idx]) {
                task.subtasks[idx].done = el.checked;
                save();
                render();
            }
        });
    });

    // 拖曳
    container.querySelectorAll('.task-item[draggable]').forEach(el => {
        el.addEventListener('dragstart', onDragStart);
        el.addEventListener('dragover', onDragOver);
        el.addEventListener('drop', onDrop);
        el.addEventListener('dragend', onDragEnd);
    });
}

function renderTaskItem(task) {
    const cat = task.categoryId ? getCategory(task.categoryId) : null;
    const overdue = isOverdue(task);
    const isTaskToday = isToday(task);
    const priorityLabels = { high: '高', medium: '中', low: '低' };
    const selected = state.selectedTasks.has(task.id);
    const showBulk = state.selectedTasks.size > 0;

    const subtasksDone = (task.subtasks || []).filter(s => s.done).length;
    const subtasksTotal = (task.subtasks || []).length;

    let dueMeta = '';
    if (task.dueDate) {
        const cls = overdue ? 'overdue' : (isTaskToday ? 'today' : '');
        const icon = overdue ? '⚠️' : '📅';
        const label = overdue ? '逾期：' : (isTaskToday ? '今日：' : '');
        dueMeta = `<span class="task-due ${cls}">${icon} ${label}${formatDate(task.dueDate)}${task.dueTime ? ' ' + task.dueTime : ''}</span>`;
    }

    const catMeta = cat
        ? `<span class="task-category-badge" style="background:${cat.color}22;color:${cat.color}">
               <span style="width:6px;height:6px;border-radius:50%;background:${cat.color};display:inline-block"></span>
               ${cat.name}
           </span>`
        : '';

    const tagsMeta = (task.tags || []).length
        ? `<div class="task-tags">${task.tags.map(t => `<span class="task-tag">#${t}</span>`).join('')}</div>`
        : '';

    const subtasksMeta = subtasksTotal
        ? `<div class="task-subtasks">
               <div class="subtask-progress">${subtasksDone}/${subtasksTotal} 子任務完成</div>
               <div class="subtask-mini-list">
                   ${task.subtasks.map((s, i) =>
                       `<div class="subtask-mini-item">
                           <input type="checkbox" class="subtask-mini-checkbox" data-index="${i}" ${s.done ? 'checked' : ''}>
                           <span class="subtask-mini-title ${s.done ? 'done' : ''}">${escHtml(s.title)}</span>
                       </div>`
                   ).join('')}
               </div>
           </div>`
        : '';

    return `<div class="task-item priority-${task.priority} ${task.completed ? 'completed' : ''} ${overdue ? 'overdue' : ''}"
                 data-id="${task.id}" draggable="true">
        ${showBulk ? `<input type="checkbox" class="task-select" data-id="${task.id}" ${selected ? 'checked' : ''} onchange="toggleSelectTask('${task.id}', this.checked)">` : ''}
        <div class="drag-handle" title="拖曳排序">⋮⋮</div>
        <div class="task-checkbox ${task.completed ? 'checked' : ''}" onclick="toggleTask('${task.id}')">
            ${task.completed ? '✓' : ''}
        </div>
        <div class="task-body">
            <div class="task-header">
                <span class="task-title">${escHtml(task.title)}</span>
                <span class="task-priority-badge badge-${task.priority}">${priorityLabels[task.priority]}</span>
            </div>
            ${task.desc ? `<div class="task-desc">${escHtml(task.desc)}</div>` : ''}
            ${(dueMeta || catMeta || tagsMeta) ? `<div class="task-meta">${dueMeta}${catMeta}${tagsMeta}</div>` : ''}
            ${subtasksMeta}
        </div>
        <div class="task-actions">
            <button class="task-action-btn" onclick="openEditModal('${task.id}')" title="編輯">✏️</button>
            <button class="task-action-btn" onclick="duplicateTask('${task.id}')" title="複製">📋</button>
            <button class="task-action-btn delete" onclick="deleteTask('${task.id}')" title="刪除">🗑️</button>
        </div>
    </div>`;
}

function escHtml(str) {
    return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ===== 任務操作 ===== */
function addTask(data) {
    const task = {
        id: genId(),
        title: data.title.trim(),
        desc: (data.desc || '').trim(),
        priority: data.priority || 'medium',
        categoryId: data.categoryId || null,
        dueDate: data.dueDate || null,
        dueTime: data.dueTime || null,
        tags: data.tags || [],
        subtasks: data.subtasks || [],
        completed: false,
        createdAt: Date.now(),
    };
    state.tasks.unshift(task);
    save();
    render();
    showToast('任務已新增', 'success');
    return task;
}

function updateTask(id, data) {
    const task = state.tasks.find(t => t.id === id);
    if (!task) return;
    Object.assign(task, {
        title: data.title.trim(),
        desc: (data.desc || '').trim(),
        priority: data.priority || 'medium',
        categoryId: data.categoryId || null,
        dueDate: data.dueDate || null,
        dueTime: data.dueTime || null,
        tags: data.tags || [],
        subtasks: data.subtasks || [],
        updatedAt: Date.now(),
    });
    save();
    render();
    showToast('任務已更新', 'success');
}

function toggleTask(id) {
    const task = state.tasks.find(t => t.id === id);
    if (!task) return;
    task.completed = !task.completed;
    save();
    render();
    showToast(task.completed ? '任務完成！' : '任務重新啟動', task.completed ? 'success' : 'info');
}

function deleteTask(id) {
    const idx = state.tasks.findIndex(t => t.id === id);
    if (idx === -1) return;
    state.tasks.splice(idx, 1);
    state.selectedTasks.delete(id);
    save();
    render();
    showToast('任務已刪除', 'info');
}

function duplicateTask(id) {
    const task = state.tasks.find(t => t.id === id);
    if (!task) return;
    const copy = { ...task, id: genId(), title: task.title + ' (複本)', createdAt: Date.now(), completed: false };
    state.tasks.unshift(copy);
    save();
    render();
    showToast('任務已複製', 'success');
}

function openAddModal() {

function openEditModal(id) {
    const task = state.tasks.find(t => t.id === id);
    if (!task) return;
    state.editingTaskId = id;
    state.editingTags = [...(task.tags || [])];
    state.editingSubtasks = (task.subtasks || []).map(s => ({ ...s }));

    document.getElementById('taskTitle').value = task.title;
    document.getElementById('taskDesc').value = task.desc || '';
    document.getElementById('taskPriority').value = task.priority || 'medium';
    document.getElementById('taskCategory').value = task.categoryId || '';
    document.getElementById('taskDueDate').value = task.dueDate || '';
    document.getElementById('taskDueTime').value = task.dueTime || '';
    renderTagsPreview();
    renderSubtaskEdit();
    showModal('taskModal');

document.getElementById('modalSave').addEventListener('click', saveTaskModal);

function saveTaskModal() {
    const title = document.getElementById('taskTitle').value.trim();
    if (!title) {
        document.getElementById('taskTitle').focus();
        showToast('請輸入任務名稱', 'error');
        return;
    }
    const data = {
        title,
        desc: document.getElementById('taskDesc').value,
        priority: document.getElementById('taskPriority').value,
        categoryId: document.getElementById('taskCategory').value || null,
        dueDate: document.getElementById('taskDueDate').value || null,
        dueTime: document.getElementById('taskDueTime').value || null,
        tags: state.editingTags,
        subtasks: state.editingSubtasks,
    };

    if (state.editingTaskId) {
        updateTask(state.editingTaskId, data);
    } else {
        addTask(data);
    }
    hideModal('taskModal');
}

function deleteCategory(id, e) {
    e.stopPropagation();
    const cat = getCategory(id);
    if (!cat) return;
    state.categories = state.categories.filter(c => c.id !== id);
    state.tasks.forEach(t => { if (t.categoryId === id) t.categoryId = null; });
    if (state.currentCategory === id) state.currentCategory = null;
    save();
    render();
    showToast(`分類「${cat.name}」已刪除`, 'info');
}

function selectCategory(catId) {

        state.currentCategory = catId;

/* ===== 拖曳排序 ===== */
function onDragStart(e) {
    state.dragSrcId = e.currentTarget.dataset.id;
    e.currentTarget.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
}

function onDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.task-item').forEach(el => el.classList.remove('drag-over'));
    e.currentTarget.classList.add('drag-over');
}

function onDrop(e) {
    e.preventDefault();
    const targetId = e.currentTarget.dataset.id;
    if (!state.dragSrcId || state.dragSrcId === targetId) return;

    const srcIdx = state.tasks.findIndex(t => t.id === state.dragSrcId);
    const tgtIdx = state.tasks.findIndex(t => t.id === targetId);
    if (srcIdx === -1 || tgtIdx === -1) return;

    const [removed] = state.tasks.splice(srcIdx, 1);
    state.tasks.splice(tgtIdx, 0, removed);
    save();
    render();
}

function onDragEnd(e) {
    e.currentTarget.classList.remove('dragging');
    document.querySelectorAll('.task-item').forEach(el => el.classList.remove('drag-over'));
    state.dragSrcId = null;
}

document.getElementById('exportBtn').addEventListener('click', () => {
    const data = { tasks: state.tasks, categories: state.categories, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `todo_export_${today()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('匯出成功', 'success');
});

document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        try {
            const data = JSON.parse(ev.target.result);
            if (Array.isArray(data.tasks)) {
                state.tasks = data.tasks;
                state.categories = Array.isArray(data.categories) ? data.categories : state.categories;
                save();
                render();
                showToast(`匯入成功：${data.tasks.length} 個任務`, 'success');
            } else {
                showToast('檔案格式不正確', 'error');
            }
        } catch { showToast('解析失敗', 'error'); }
        e.target.value = '';
    };
    reader.readAsText(file);
});

/* ===== 統計 ===== */
document.getElementById('statsBtn').addEventListener('click', () => {
    const total = state.tasks.length;
    const done = state.tasks.filter(t => t.completed).length;
    const active = state.tasks.filter(t => !t.completed).length;
    const overdue = state.tasks.filter(isOverdue).length;
    const high = state.tasks.filter(t => t.priority === 'high').length;
    const med = state.tasks.filter(t => t.priority === 'medium').length;
    const low = state.tasks.filter(t => t.priority === 'low').length;
    const pct = total ? Math.round(done / total * 100) : 0;
    const circum = 2 * Math.PI * 50;

    document.getElementById('sTotalTasks').textContent = total;
    document.getElementById('sCompletedTasks').textContent = done;
    document.getElementById('sActiveTasks').textContent = active;
    document.getElementById('sOverdueTasks').textContent = overdue;
    document.getElementById('sHighCount').textContent = high;
    document.getElementById('sMedCount').textContent = med;
    document.getElementById('sLowCount').textContent = low;

    const maxP = Math.max(high, med, low, 1);
    document.getElementById('sHighBar').style.width = Math.round(high / maxP * 100) + '%';
    document.getElementById('sMedBar').style.width = Math.round(med / maxP * 100) + '%';
    document.getElementById('sLowBar').style.width = Math.round(low / maxP * 100) + '%';

    document.getElementById('donutLabel').textContent = pct + '%';
    const fillLen = circum * pct / 100;
    document.getElementById('donutFill').setAttribute('stroke-dasharray', `${fillLen} ${circum - fillLen}`);

    showModal('statsModal');
});

// 新增任務按鈕 (點 filter bar 右邊空白處 not used, use topbar)
// 讓 topbar logo 可開 Modal
document.querySelector('.logo')?.addEventListener('dblclick', openAddModal);

// Modal 關閉
['modalClose','modalCancel'].forEach(id => {
    document.getElementById(id)?.addEventListener('click', () => hideModal('taskModal'));
});
['categoryModalClose','categoryModalCancel'].forEach(id => {
    document.getElementById(id)?.addEventListener('click', () => hideModal('categoryModal'));
});
document.getElementById('statsModalClose')?.addEventListener('click', () => hideModal('statsModal'));

// 點 overlay 關閉
document.querySelectorAll('.modal-overlay').forEach(el => {
    el.addEventListener('click', e => {
        if (e.target === el) hideModal(el.id);
    });
});

// Enter 儲存分類
document.getElementById('categoryName').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('categoryModalSave').click();
    if (e.key === 'Escape') hideModal('categoryModal');
});

/* ===== 鍵盤快速鍵 ===== */
document.addEventListener('keydown', e => {
    // Ctrl+N 新增
    if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
        e.preventDefault();
        openAddModal();
    }
    // Ctrl+F 搜尋
    if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
        document.getElementById('searchInput').select();
    }
    // Escape 關閉 Modal
    if (e.key === 'Escape') {
        ['taskModal','categoryModal','statsModal'].forEach(id => {
            if (document.getElementById(id).style.display !== 'none') hideModal(id);
        });
    }
});

/* ===== 右鍵 / 雙擊 開啟 Modal ===== */
document.getElementById('taskList').addEventListener('dblclick', e => {
    const item = e.target.closest('.task-item');
    if (item) openEditModal(item.dataset.id);
});

// 新增按鈕 (快速新增旁邊點擊更多)
document.getElementById('quickAddInput').addEventListener('keydown', e => {
    if (e.key === 'Tab') {
        e.preventDefault();
        const title = document.getElementById('quickAddInput').value.trim();
        if (title) {
            openAddModal();
            // 帶入標題
            setTimeout(() => { document.getElementById('taskTitle').value = title; }, 50);
            document.getElementById('quickAddInput').value = '';
        } else {
            openAddModal();
        }
    }
});
