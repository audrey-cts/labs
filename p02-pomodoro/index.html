<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全響應式蕃茄鐘</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>🍅 全響應式蕃茄鐘</h1>

      <div class="mode-tabs" role="tablist" aria-label="模式切換">
        <button class="tab active" data-mode="work">專注</button>
        <button class="tab" data-mode="shortBreak">短休息</button>
        <button class="tab" data-mode="longBreak">長休息</button>
      </div>

      <p id="status" class="status">準備開始專注</p>
      <div class="timer" id="timer" aria-live="polite">25:00</div>

      <div class="actions">
        <button id="startPauseBtn" class="btn primary">開始</button>
        <button id="resetBtn" class="btn">重設</button>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="label">完成輪數</span>
          <span id="sessionCount" class="value">0</span>
        </div>
        <div class="stat">
          <span class="label">下一個</span>
          <span id="nextMode" class="value">專注</span>
        </div>
      </div>

      <form class="settings" id="settingsForm">
        <h2>時間設定（分鐘）</h2>
        <label>專注
          <input type="number" id="workInput" min="1" max="90" value="25">
        </label>
        <label>短休息
          <input type="number" id="shortBreakInput" min="1" max="30" value="5">
        </label>
        <label>長休息
          <input type="number" id="longBreakInput" min="1" max="60" value="15">
        </label>
        <button type="submit" class="btn">套用設定</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
